services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matricula
      POSTGRES_USER: matricula
      POSTGRES_PASSWORD: matricula
    ports:
      - '5432:5432'
    volumes:
      - matricula_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matricula -d matricula"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  matricula_pg_data:
