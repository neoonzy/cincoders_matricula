image: node:22

stages:
  - validate

verify:
  stage: validate
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: matricula_test
    POSTGRES_USER: matricula
    POSTGRES_PASSWORD: matricula
    TEST_DATABASE_URL: postgres://matricula:matricula@postgres:5432/matricula_test
    SESSION_SECRET: chave-de-testes-do-ci-com-pelo-menos-trinta-e-dois-caracteres
    NODE_ENV: test
  script:
    - npm ci --no-audit --no-fund
    - node apps/api/scripts/wait-db.mjs
    - npm test
    - npm run test:integration
    - npm run build
